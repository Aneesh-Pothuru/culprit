[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "culprit-debugger"
version = "0.2.0"
description = "Counterfactual component, checkpoint, and data attribution for model stacks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Aneesh Pothuru"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
mcap = ["mcap>=1.2", "mcap-ros2-support>=0.5"]

[project.scripts]
culprit = "culprit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
culprit = ["resources/*.json"]
